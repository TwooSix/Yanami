[workspace]
resolver = "3"
members = [
    "crates/yanami-application",
    "crates/yanami-core",
    "crates/yanami-emby",
    "crates/yanami-danmaku",
    "crates/yanami-storage",
    "crates/yanami-desktop-bridge",
    "crates/yanami-performance-probe",
]

[workspace.package]
version = "0.2.0-dev.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
authors = ["Yanami contributors"]

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
http = "1"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service"] }
md-5 = "0.10"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
