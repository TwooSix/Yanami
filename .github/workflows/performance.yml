name: Performance gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # GitHub schedules use UTC. Nightly and weekly runs are deliberately split
    # so the fixed performance machine never runs both profiles concurrently.
    - cron: "17 18 * * 1-6"
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  classify:
    name: Performance / Classify changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
      suites: ${{ steps.paths.outputs.suites }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select performance suites
        id: paths
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $zeroSha = "0000000000000000000000000000000000000000"
          $baseExists = $env:BASE_SHA -and $env:BASE_SHA -ne $zeroSha
          if ($baseExists) {
            git cat-file -e "$env:BASE_SHA^{commit}" 2>$null
            $baseExists = $LASTEXITCODE -eq 0
          }
          if ($baseExists) {
            $changed = @(git diff --name-only --diff-filter=ACDMRTUXB `
              $env:BASE_SHA $env:HEAD_SHA)
          } else {
            # A new branch has no usable before SHA. Treat every tracked file as
            # changed rather than risk silently skipping a relevant gate.
            $changed = @(git ls-files)
          }

          $changed = @($changed | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $nonProductPattern = '^(docs/|licenses/|LICENSE(?:$|\.)|README(?:\.|$)|.*\.md$)'
          $relevantFiles = @($changed | Where-Object { $_ -notmatch $nonProductPattern })

          $suiteOrder = @("Search", "Backend", "Interaction", "Playback", "Danmaku", "Startup")
          $selected = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::OrdinalIgnoreCase)

          foreach ($path in $relevantFiles) {
            $normalized = $path.Replace('\', '/')

            # Changes to the gate itself, shared build inputs, or runtime
            # contracts can influence every scenario. Conservatively run all.
            if ($normalized -match '^(perf/|scripts/performance/|\.github/workflows/performance\.yml$)' -or
                $normalized -match '^(Cargo\.toml|Cargo\.lock|VERSION)$' -or
                $normalized -match '(^|/)CMakeLists\.txt$' -or
                $normalized -match '^crates/(yanami-domain|yanami-application|yanami-desktop-bridge)/' -or
                $normalized -match '^apps/desktop/native/(ApplicationViewModel|DesktopBackendServices|RustBridgeRuntime)') {
              foreach ($suite in $suiteOrder) { [void]$selected.Add($suite) }
              continue
            }

            if ($normalized -match '(?i)(search|mediaquery|mediastore|catalog|storage|index)') {
              [void]$selected.Add("Search")
            }
            if ($normalized -match '^crates/' -or
                $normalized -match '^apps/desktop/native/.*(Backend|Bridge|Coordinator|Port|Worker)') {
              [void]$selected.Add("Backend")
            }
            if ($normalized -match '^apps/desktop/(qml|native)/') {
              [void]$selected.Add("Interaction")
            }
            if ($normalized -match '(?i)(playback|player|mpv|video|subtitle)') {
              [void]$selected.Add("Playback")
            }
            if ($normalized -match '(?i)(danmaku|PlayerPage\.qml|MpvVideoItem|scene.?graph|renderer)') {
              [void]$selected.Add("Danmaku")
              [void]$selected.Add("Playback")
            }
            if ($normalized -match '(?i)(^apps/desktop/native/(main|WindowController)\.cpp$|^apps/desktop/qml/(Main\.qml|pages/(HomePage|LoginPage)\.qml|components/)|startup|bootstrap|session|preference|cache|storage)') {
              [void]$selected.Add("Startup")
            }
          }

          if ($relevantFiles.Count -gt 0 -and $selected.Count -eq 0) {
            # Unknown product paths default to broad coverage. The classifier
            # must never turn an unfamiliar runtime change into a false skip.
            foreach ($suite in $suiteOrder) { [void]$selected.Add($suite) }
          }

          $orderedSuites = @($suiteOrder | Where-Object { $selected.Contains($_) })
          $isRelevant = $relevantFiles.Count -gt 0
          "relevant=$($isRelevant.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "suites=$($orderedSuites -join ',')" >> $env:GITHUB_OUTPUT

          @(
            "## Performance path classification"
            ""
            "- Changed files: $($changed.Count)"
            "- Product-relevant files: $($relevantFiles.Count)"
            "- Suites: $(if ($orderedSuites.Count) { $orderedSuites -join ', ' } else { 'none (docs/licenses only)' })"
          ) >> $env:GITHUB_STEP_SUMMARY

  hosted-smoke:
    name: Performance / Hosted smoke
    needs: classify
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PERF_OUTPUT: ${{ github.workspace }}\build\performance\hosted
      YANAMI_PERF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Record docs-only skip
        if: needs.classify.outputs.relevant != 'true'
        shell: pwsh
        run: |
          @(
            "## Hosted performance smoke"
            ""
            "No product files changed; the performance smoke was intentionally skipped."
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: Keep repository line endings stable
        if: needs.classify.outputs.relevant == 'true'
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        if: needs.classify.outputs.relevant == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the MSYS2 UCRT64 desktop toolchain
        if: needs.classify.outputs.relevant == 'true'
        id: msys2
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-mpv

      - name: Install the matching Rust GNU toolchain
        if: needs.classify.outputs.relevant == 'true'
        shell: pwsh
        run: >-
          rustup toolchain install stable-x86_64-pc-windows-gnu
          --profile minimal

      - name: Run hosted pull-request gates
        if: needs.classify.outputs.relevant == 'true'
        shell: pwsh
        env:
          YANAMI_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          $ucrtBin = Join-Path $env:YANAMI_MSYS2_ROOT "ucrt64\bin"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$ucrtBin;$env:PATH"
          & .\scripts\performance\run-gate.ps1 `
            -Profile PullRequest `
            -OutputDirectory $env:PERF_OUTPUT `
            -Suites '${{ needs.classify.outputs.suites }}' `
            -CandidateSha $env:YANAMI_PERF_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload hosted performance results
        if: always() && needs.classify.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_OUTPUT }}/**/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  windows-lab:
    name: Performance / Windows lab
    needs: classify
    if: >-
      needs.classify.result == 'success' &&
      needs.classify.outputs.relevant == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Register exactly one isolated, non-production host with the custom
    # yanami-performance label. The job condition excludes fork pull requests
    # even though this workflow intentionally has no repository secrets.
    runs-on: [self-hosted, Windows, X64, yanami-performance]
    timeout-minutes: 60
    env:
      PERF_OUTPUT: ${{ github.workspace }}\build\performance\lab
      YANAMI_PERF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      YANAMI_PERF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Keep repository line endings stable
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run path-sensitive fixed-machine gates
        shell: pwsh
        run: |
          $comparisonBaseSha = $env:YANAMI_PERF_BASE_SHA
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $comparisonBaseSha = (& git merge-base $env:YANAMI_PERF_HEAD_SHA $env:YANAMI_PERF_BASE_SHA).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $comparisonBaseSha) { throw 'Unable to resolve the pull-request merge-base.' }
          }
          $gateArgs = @{
            Profile = 'Lab'
            OutputDirectory = $env:PERF_OUTPUT
            Suites = '${{ needs.classify.outputs.suites }}'
            BaseSha = $comparisonBaseSha
            CandidateSha = $env:YANAMI_PERF_HEAD_SHA
          }
          if ($env:YANAMI_PERF_ABAB_RESULT_PATHS) {
            $gateArgs.ComparisonResultPath = @(
              $env:YANAMI_PERF_ABAB_RESULT_PATHS.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries) |
                ForEach-Object { $_.Trim() }
            )
          }
          & .\scripts\performance\run-gate.ps1 @gateArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload fixed-machine performance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_OUTPUT }}/**/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  nightly:
    name: Performance / Nightly
    if: github.event_name == 'schedule' && github.event.schedule == '17 18 * * 1-6'
    runs-on: [self-hosted, Windows, X64, yanami-performance]
    timeout-minutes: 120
    env:
      PERF_OUTPUT: ${{ github.workspace }}\build\performance\nightly
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the nightly performance matrix
        shell: pwsh
        run: |
          & .\scripts\performance\run-gate.ps1 `
            -Profile Nightly `
            -OutputDirectory $env:PERF_OUTPUT `
            -Suites 'Search,Backend,Interaction,Playback,Danmaku,Startup' `
            -CandidateSha '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload nightly performance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_OUTPUT }}/**/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  weekly:
    name: Performance / Weekly
    if: github.event_name == 'schedule' && github.event.schedule == '17 18 * * 0'
    runs-on: [self-hosted, Windows, X64, yanami-performance]
    timeout-minutes: 240
    env:
      PERF_OUTPUT: ${{ github.workspace }}\build\performance\weekly
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the weekly endurance matrix
        shell: pwsh
        run: |
          & .\scripts\performance\run-gate.ps1 `
            -Profile Weekly `
            -OutputDirectory $env:PERF_OUTPUT `
            -Suites 'Search,Backend,Interaction,Playback,Danmaku,Startup' `
            -CandidateSha '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload weekly performance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_OUTPUT }}/**/*
          if-no-files-found: error
          overwrite: true
          retention-days: 60

  release:
    name: Performance / Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, yanami-performance]
    timeout-minutes: 360
    env:
      PERF_OUTPUT: ${{ github.workspace }}\build\performance\release
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the release performance gate
        shell: pwsh
        run: |
          & .\scripts\performance\run-gate.ps1 `
            -Profile Release `
            -Mode enforce `
            -OutputDirectory $env:PERF_OUTPUT `
            -Suites 'Search,Backend,Interaction,Playback,Danmaku,Startup' `
            -CandidateSha '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release performance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_OUTPUT }}/**/*
          if-no-files-found: error
          overwrite: true
          retention-days: 90
