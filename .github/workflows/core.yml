name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope / Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      desktop: ${{ steps.paths.outputs.desktop }}
      workflows: ${{ steps.paths.outputs.workflows }}
      native_analysis: ${{ steps.paths.outputs.native_analysis }}
      performance: ${{ steps.paths.outputs.performance }}
      performance_suites: ${{ steps.paths.outputs.performance_suites }}
      package: ${{ steps.paths.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required CI suites
        id: paths
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: >-
          & .\.github\scripts\Classify-CI.ps1
          -BaseSha $env:BASE_SHA
          -HeadSha $env:HEAD_SHA
          -ResultPath build\ci-scope\scope.json
      - name: Upload the release routing decision
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-scope-${{ github.run_id }}
          path: build/ci-scope/scope.json
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  workflow-lint:
    name: Static analysis (workflows)
    needs: scope
    if: needs.scope.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the CI classifier
        shell: pwsh
        run: .\.github\scripts\Test-Classify-CI.ps1
      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t yaml_files < <(find .github -type f \
            \( -name '*.yml' -o -name '*.yaml' \) -print)
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            "${yaml_files[@]}"
      - name: Run actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" \
            | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml

  rust:
    name: Rust quality (Linux)
    needs: [scope, workflow-lint]
    if: >-
      !cancelled() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.rust == 'true' &&
      (needs.scope.outputs.workflows == 'false' ||
       needs.workflow-lint.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install credential-vault dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-16
        with:
          components: clippy,rustfmt
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-
      - name: Cache pinned Rust CI tools
        id: rust-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-about
            ~/.cargo/bin/cargo-audit
          key: rust-ci-tools-v1-cargo-about-0.9.1-cargo-audit-0.22.2
      - name: Install pinned Rust CI tools
        if: steps.rust-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Validate development version source
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(tr -d '[:space:]' < VERSION)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.0$ ]]
          test "$source_version" = "$cargo_version"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: RustSec advisory audit
        run: cargo audit --file Cargo.lock
      - name: Rust license inventory is complete and current
        run: |
          mkdir -p build/license-check
          cargo about generate --workspace --locked \
            --target x86_64-pc-windows-gnu --fail \
            licenses/rust/about.hbs \
            -o build/license-check/THIRD_PARTY_LICENSES.html
          cmp --silent \
            licenses/rust/THIRD_PARTY_LICENSES.html \
            build/license-check/THIRD_PARTY_LICENSES.html
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked

  desktop-linux:
    name: Desktop (Linux x86_64)
    needs: [scope, workflow-lint, rust]
    if: >-
      !cancelled() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.desktop == 'true' &&
      (needs.scope.outputs.workflows == 'false' ||
       needs.workflow-lint.result == 'success') &&
      (needs.scope.outputs.rust == 'false' ||
       needs.rust.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL for native code
        if: needs.scope.outputs.native_analysis == 'true'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake ninja-build pkg-config \
            libdbus-1-dev libgl1-mesa-dev libmpv-dev
      - name: Install Qt 6.8.3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install \
            --disable-pip-version-check aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/python" -m aqt install-qt \
            linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          qt_root="$RUNNER_TEMP/Qt/6.8.3/gcc_64"
          test -x "$qt_root/bin/qtpaths"
          echo "QT_ROOT_DIR=$qt_root" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-16
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-
      - name: Configure, build, and test the desktop
        shell: bash
        run: |
          set -euo pipefail
          cmake -S apps/desktop -B build/ci-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_TESTING=ON \
            -DYANAMI_ENABLE_DEV_HOOKS=OFF \
            -DYANAMI_BUILD_COMMIT=${{ github.sha }} \
            -DYANAMI_BUILD_RUN_ID=${{ github.run_id }} \
            -DYANAMI_PACKAGE_ARCHITECTURE=x86_64
          cmake --build build/ci-linux --parallel
          ctest --test-dir build/ci-linux --output-on-failure
      - name: Audit and launch the PR install tree
        if: needs.scope.outputs.package == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ci-linux \
            --target yanami-pr-install-smoke --config Release --parallel
      - name: Analyze native code with CodeQL
        if: needs.scope.outputs.native_analysis == 'true'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:c-cpp

  desktop-windows:
    name: Desktop (Windows x86_64)
    needs: [scope, workflow-lint, rust]
    if: >-
      !cancelled() &&
      needs.scope.result == 'success' &&
      (needs.scope.outputs.desktop == 'true' ||
       needs.scope.outputs.performance == 'true') &&
      (needs.scope.outputs.workflows == 'false' ||
       needs.workflow-lint.result == 'success') &&
      (needs.scope.outputs.rust == 'false' ||
       needs.rust.result == 'success')
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PERF_OUTPUT: ${{ github.workspace }}\build\performance\hosted
    steps:
      - name: Keep repository line endings stable
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the MSYS2 UCRT64 desktop toolchain
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mpv
      - name: Install the matching Rust GNU toolchain
        shell: pwsh
        run: >-
          rustup toolchain install stable-x86_64-pc-windows-gnu
          --profile minimal
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-
      - name: Configure, build, and test the desktop
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $ucrtBin = Join-Path $msysRoot "ucrt64\bin"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$ucrtBin;$env:PATH"
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-gnu"
          & "$ucrtBin\cmake.exe" -S apps/desktop -B build/ci-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$msysRoot\ucrt64" `
            "-DCMAKE_CXX_COMPILER=$ucrtBin\g++.exe" `
            -DBUILD_TESTING=ON `
            -DYANAMI_ENABLE_DEV_HOOKS=OFF `
            "-DYANAMI_BUILD_COMMIT=${{ github.sha }}" `
            "-DYANAMI_BUILD_RUN_ID=${{ github.run_id }}" `
            -DYANAMI_PACKAGE_ARCHITECTURE=x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$ucrtBin\cmake.exe" --build build/ci-windows --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$ucrtBin\ctest.exe" --test-dir build/ci-windows --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit and launch the PR install tree
        if: needs.scope.outputs.package == 'true'
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $ucrtBin = Join-Path $msysRoot "ucrt64\bin"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$ucrtBin;$env:PATH"
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-gnu"
          & "$ucrtBin\cmake.exe" --build build/ci-windows `
            --target yanami-pr-install-smoke --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate performance gate contracts
        if: needs.scope.outputs.performance == 'true'
        shell: pwsh
        env:
          YANAMI_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          $ucrtBin = Join-Path $env:YANAMI_MSYS2_ROOT "ucrt64\bin"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$ucrtBin;$env:PATH"
          & .\scripts\performance\Test-PerfGate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run hosted pull-request performance gates
        id: performance-gate
        if: needs.scope.outputs.performance == 'true'
        shell: pwsh
        env:
          YANAMI_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
          YANAMI_PERF_HEAD_SHA: ${{ github.sha }}
        run: |
          $ucrtBin = Join-Path $env:YANAMI_MSYS2_ROOT "ucrt64\bin"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$ucrtBin;$env:PATH"
          & .\scripts\performance\run-gate.ps1 `
            -Profile PullRequest `
            -OutputDirectory $env:PERF_OUTPUT `
            -Suites '${{ needs.scope.outputs.performance_suites }}' `
            -CandidateSha $env:YANAMI_PERF_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish hosted performance summary
        if: always() && needs.scope.outputs.performance == 'true'
        shell: pwsh
        run: |
          $summary = Join-Path $env:PERF_OUTPUT "perf-summary.md"
          if (Test-Path -LiteralPath $summary -PathType Leaf) {
            Get-Content -LiteralPath $summary -Raw >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload hosted performance results
        if: >-
          !cancelled() &&
          needs.scope.outputs.performance == 'true' &&
          steps.performance-gate.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_OUTPUT }}/**/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  desktop-macos:
    name: Desktop (macOS ${{ matrix.architecture }})
    needs: [scope, workflow-lint, rust]
    if: >-
      !cancelled() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.desktop == 'true' &&
      (needs.scope.outputs.workflows == 'false' ||
       needs.workflow-lint.result == 'success') &&
      (needs.scope.outputs.rust == 'false' ||
       needs.rust.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: brew install jq mpv pkg-config
      - name: Install Qt 6.8.3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install \
            --disable-pip-version-check aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/python" -m aqt install-qt \
            mac desktop 6.8.3 clang_64 -O "$RUNNER_TEMP/Qt"
          qt_root="$RUNNER_TEMP/Qt/6.8.3/macos"
          test -x "$qt_root/bin/qtpaths"
          echo "QT_ROOT_DIR=$qt_root" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-16
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-
      - name: Configure, build, and test the desktop
        shell: bash
        run: |
          set -euo pipefail
          cmake -S apps/desktop -B build/ci-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DBUILD_TESTING=ON \
            -DYANAMI_ENABLE_DEV_HOOKS=OFF \
            -DYANAMI_BUILD_COMMIT=${{ github.sha }} \
            -DYANAMI_BUILD_RUN_ID=${{ github.run_id }} \
            -DYANAMI_PACKAGE_ARCHITECTURE=${{ matrix.architecture }}
          cmake --build build/ci-macos --parallel
          ctest --test-dir build/ci-macos --output-on-failure
      - name: Audit and launch the PR install tree
        if: needs.scope.outputs.package == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/ci-macos \
            --target yanami-pr-install-smoke --config Release --parallel

  required:
    name: CI / Required
    needs: [scope, workflow-lint, rust, desktop-linux, desktop-windows, desktop-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected suite to pass
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq --exit-status '
            (.scope.result == "success") and
            (.scope.outputs.rust == "true" or .scope.outputs.rust == "false") and
            (.scope.outputs.desktop == "true" or .scope.outputs.desktop == "false") and
            (.scope.outputs.workflows == "true" or .scope.outputs.workflows == "false") and
            (.scope.outputs.native_analysis == "true" or .scope.outputs.native_analysis == "false") and
            (.scope.outputs.performance == "true" or .scope.outputs.performance == "false") and
            (.scope.outputs.package == "true" or .scope.outputs.package == "false") and
            (if .scope.outputs.native_analysis == "true"
             then .scope.outputs.desktop == "true" else true end) and
            (if .scope.outputs.rust == "true"
             then .rust.result == "success" else .rust.result == "skipped" end) and
            (if .scope.outputs.workflows == "true"
             then ."workflow-lint".result == "success"
             else ."workflow-lint".result == "skipped" end) and
            (if .scope.outputs.desktop == "true"
             then (."desktop-linux".result == "success" and
                   ."desktop-macos".result == "success")
             else (."desktop-linux".result == "skipped" and
                   ."desktop-macos".result == "skipped") end) and
            (if (.scope.outputs.desktop == "true" or
                 .scope.outputs.performance == "true")
             then ."desktop-windows".result == "success"
             else ."desktop-windows".result == "skipped" end) and
            (if .scope.outputs.performance == "true"
             then ((.scope.outputs.performance_suites // "") | length) > 0
             else (.scope.outputs.performance_suites // "") == "" end)
          ' <<<"$NEEDS_JSON" >/dev/null
          {
            echo "## Required CI gate"
            echo
            echo "All selected CI suites passed; non-applicable suites were skipped."
          } >> "$GITHUB_STEP_SUMMARY"
