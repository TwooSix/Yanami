name: Desktop packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Package all platforms or run a Linux-only preflight
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-only

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve the immutable development candidate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      short-sha: ${{ steps.version.outputs.short-sha }}
      source-version: ${{ steps.version.outputs.source-version }}
      version: ${{ steps.version.outputs.version }}
      scope: ${{ steps.version.outputs.scope }}
      package-relevant: ${{ steps.package.outputs.relevant }}
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PACKAGE_SCOPE: ${{ inputs.scope || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the verified CI routing decision
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-scope-${{ github.event.workflow_run.id }}
          path: build/ci-scope
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve package relevance
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            relevant=true
          else
            routing=build/ci-scope/scope.json
            jq -e --arg sha "$SOURCE_SHA" '
              .schemaVersion == 1 and
              (.packageRelevant | type) == "boolean" and
              .headSha == $sha
            ' "$routing" >/dev/null
            relevant="$(jq -r '.packageRelevant' "$routing")"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          {
            echo "## Package routing"
            echo
            if [[ "$relevant" == true ]]; then
              echo "This candidate changes packaged inputs; platform packaging is required."
            else
              echo "Only non-packaged CI, performance, or documentation inputs changed; platform packaging is skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate main ancestry and derive the candidate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          case "$PACKAGE_SCOPE" in
            all|linux-only) ;;
            *)
              echo "Unsupported package scope: $PACKAGE_SCOPE" >&2
              exit 1
              ;;
          esac
          if [[ "${{ github.event_name }}" == workflow_dispatch \
              && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Manual packaging must be dispatched from main." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git show-ref --verify --quiet refs/remotes/origin/main
          if [[ "$PACKAGE_SCOPE" == all ]]; then
            git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          fi

          source_version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$source_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+-dev)\.0$ ]]; then
            echo "VERSION must identify a development line ending in -dev.0." >&2
            exit 1
          fi
          development_line="${BASH_REMATCH[1]}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "$cargo_version" = "$source_version"
          candidate_version="$development_line.$GITHUB_RUN_NUMBER"
          short_sha="$(git rev-parse --short=8 HEAD)"
          {
            echo "sha=$SOURCE_SHA"
            echo "short-sha=$short_sha"
            echo "source-version=$source_version"
            echo "version=$candidate_version"
            echo "scope=$PACKAGE_SCOPE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Yanami package candidate"
            echo
            echo "- Version: \`$candidate_version\`"
            echo "- Commit: \`$SOURCE_SHA\`"
            echo "- Intended tag: \`v$candidate_version\`"
            echo "- Scope: \`$PACKAGE_SCOPE\`"
            echo "- This workflow uploads artifacts only; it never creates a Release."
          } >> "$GITHUB_STEP_SUMMARY"

  windows-package:
    name: Build, audit, and verify the unsigned Windows package
    needs: [metadata, linux-package]
    if: >-
      needs.metadata.outputs.scope == 'all' &&
      needs.metadata.outputs.package-relevant == 'true' &&
      needs.linux-package.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 90
    # Restrict this environment to main. Optional reviewers pause auto-packaging.
    environment: Release
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      YANAMI_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      YANAMI_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
      YANAMI_SOURCE_VERSION: ${{ needs.metadata.outputs.source-version }}

    steps:
      - name: Keep repository line endings stable
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the MSYS2 UCRT64 desktop toolchain
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mpv

      - name: Install the matching Rust GNU toolchain
        shell: pwsh
        run: >-
          rustup toolchain install stable-x86_64-pc-windows-gnu
          --profile minimal --component clippy --component rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-

      - name: Validate the immutable main candidate
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:YANAMI_RELEASE_SHA) {
            throw "The checked-out commit does not match the resolved candidate SHA."
          }
          git show-ref --verify --quiet refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "origin/main was not fetched for release ancestry validation."
          }
          git merge-base --is-ancestor $env:YANAMI_RELEASE_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The package candidate must already be contained in origin/main."
          }

      - name: Rust release gates
        shell: pwsh
        run: |
          $ucrtBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$ucrtBin;$env:PATH"
          cargo +stable-x86_64-pc-windows-gnu fmt --all -- --check
          cargo +stable-x86_64-pc-windows-gnu clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable-x86_64-pc-windows-gnu test --workspace --all-targets --locked
          cargo +stable-x86_64-pc-windows-gnu install cargo-about `
            --version 0.9.1 --locked --features cli
          $generatedLicenses = Join-Path $env:RUNNER_TEMP "THIRD_PARTY_LICENSES.html"
          cargo +stable-x86_64-pc-windows-gnu about generate `
            --workspace --locked --target x86_64-pc-windows-gnu --fail `
            licenses/rust/about.hbs -o $generatedLicenses
          if ((Get-FileHash $generatedLicenses -Algorithm SHA256).Hash -ne
              (Get-FileHash licenses/rust/THIRD_PARTY_LICENSES.html -Algorithm SHA256).Hash) {
            throw "The checked-in Rust license report is stale."
          }

      - name: Build and test the complete Release desktop
        shell: pwsh
        env:
          YANAMI_DANDANPLAY_APP_ID: ${{ secrets.YANAMI_DANDANPLAY_APP_ID }}
          YANAMI_DANDANPLAY_APP_SECRET: ${{ secrets.YANAMI_DANDANPLAY_APP_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YANAMI_DANDANPLAY_APP_ID) -or
              [string]::IsNullOrWhiteSpace($env:YANAMI_DANDANPLAY_APP_SECRET)) {
            throw "Configure both Yanami DanDanPlay release credentials in the protected release environment."
          }
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $ucrtBin = Join-Path $msysRoot "ucrt64\bin"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$ucrtBin;$env:PATH"
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-gnu"
          & "$ucrtBin\cmake.exe" -S apps/desktop -B build/release-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$msysRoot\ucrt64" `
            "-DCMAKE_CXX_COMPILER=$ucrtBin\g++.exe" `
            -DBUILD_TESTING=ON `
            -DYANAMI_ENABLE_DEV_HOOKS=OFF `
            "-DYANAMI_BUILD_VERSION=$env:YANAMI_RELEASE_VERSION" `
            "-DYANAMI_BUILD_COMMIT=$env:YANAMI_RELEASE_SHA" `
            "-DYANAMI_BUILD_RUN_ID=$env:GITHUB_RUN_ID" `
            -DYANAMI_PACKAGE_ARCHITECTURE=x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$ucrtBin\cmake.exe" --build build/release-windows --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:YANAMI_DANDANPLAY_APP_ID -ErrorAction SilentlyContinue
          Remove-Item Env:YANAMI_DANDANPLAY_APP_SECRET -ErrorAction SilentlyContinue
          & "$ucrtBin\ctest.exe" --test-dir build/release-windows --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create the audited ZIP package
        shell: pwsh
        run: |
          $ucrtBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$ucrtBin;$env:PATH"
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-gnu"
          & "$ucrtBin\cmake.exe" --build build/release-windows --target package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the package in an isolated PATH
        shell: pwsh
        run: |
          $expectedArchive = "Yanami-$env:YANAMI_RELEASE_VERSION-Windows-x86_64.zip"
          $archive = Get-Item (Join-Path "build/release-windows" $expectedArchive) `
            -ErrorAction SilentlyContinue
          if (-not $archive) { throw "The expected desktop ZIP package was not generated." }
          if (-not (Test-Path "$($archive.FullName).sha256")) {
            throw "The outer archive checksum is missing."
          }
          $checksumText = Get-Content "$($archive.FullName).sha256" -Raw
          $checksumMatch = [regex]::Match($checksumText, '(?im)^([0-9a-f]{64})\s+')
          if (-not $checksumMatch.Success) {
            throw "The outer archive checksum has an invalid format."
          }
          $actualArchiveHash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash
          if ($actualArchiveHash -ne $checksumMatch.Groups[1].Value) {
            throw "The outer archive checksum does not match."
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP "yanami-package-smoke"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractRoot
          $executable = Get-ChildItem $extractRoot -Filter yanami-desktop.exe -Recurse |
            Select-Object -First 1
          $bridge = Get-ChildItem $extractRoot -Filter yanami_desktop_bridge.dll -Recurse |
            Select-Object -First 1
          if (-not $executable -or -not $bridge) { throw "Package binaries are missing." }
          $platformDirectory = Join-Path $executable.DirectoryName "platforms"
          foreach ($platformPlugin in @("qwindows.dll", "qoffscreen.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $platformDirectory $platformPlugin) `
                -PathType Leaf)) {
              throw "Required Windows platform plugin is missing: $platformPlugin"
            }
          }
          $vulkanLoader = Join-Path $executable.DirectoryName "vulkan-1.dll"
          if (-not (Test-Path -LiteralPath $vulkanLoader -PathType Leaf)) {
            throw "The bundled Vulkan loader is missing."
          }
          $sdlRuntime = Join-Path $executable.DirectoryName "SDL3.dll"
          if (-not (Test-Path -LiteralPath $sdlRuntime -PathType Leaf)) {
            throw "The bundled SDL3 controller runtime is missing."
          }
          $packageRoot = Split-Path -Parent (Split-Path -Parent $executable.FullName)
          foreach ($required in @(
              "LICENSE",
              "THIRD_PARTY_NOTICES.md",
              "BUILD_INFO.json",
              "SHA256SUMS.txt",
              "licenses\RUST_DEPENDENCIES.md",
              "licenses\rust\THIRD_PARTY_LICENSES.html",
              "licenses\ffmpeg\GPL-3.0-or-later.txt",
              "licenses\libass\ISC.txt",
              "licenses\mpv\GPL-2.0-or-later.txt",
              "licenses\msys2\PACKAGE_METADATA.txt")) {
            if (-not (Test-Path (Join-Path $packageRoot $required))) {
              throw "Package compliance file is missing: $required"
            }
          }
          if ($executable.VersionInfo.ProductVersion -ne $env:YANAMI_RELEASE_VERSION) {
            throw "Unexpected desktop ProductVersion: $($executable.VersionInfo.ProductVersion)"
          }
          $buildInfo = Get-Content (Join-Path $packageRoot "BUILD_INFO.json") -Raw |
            ConvertFrom-Json
          if ($buildInfo.version -ne $env:YANAMI_RELEASE_VERSION -or
              $buildInfo.sourceVersion -ne $env:YANAMI_SOURCE_VERSION -or
              $buildInfo.commit -ne $env:YANAMI_RELEASE_SHA -or
              $buildInfo.workflowRunId -ne $env:GITHUB_RUN_ID -or
              $buildInfo.platform -ne "Windows" -or
              $buildInfo.architecture -ne "x86_64") {
            throw "BUILD_INFO.json does not identify this Windows candidate."
          }
          $manifestErrors = [Collections.Generic.List[string]]::new()
          $manifestEntries = 0
          $packageRootFull = [IO.Path]::GetFullPath($packageRoot)
          foreach ($line in Get-Content (Join-Path $packageRoot "SHA256SUMS.txt")) {
            if ($line.StartsWith("#") -or [string]::IsNullOrWhiteSpace($line)) { continue }
            if ($line -notmatch '^([0-9a-fA-F]{64})  ([0-9]+)  (.+)$') {
              $manifestErrors.Add("Malformed manifest entry: $line")
              continue
            }
            $manifestEntries++
            $relativePath = $Matches[3]
            $fullPath = [IO.Path]::GetFullPath((Join-Path $packageRootFull $relativePath))
            if (-not $fullPath.StartsWith(
                $packageRootFull + [IO.Path]::DirectorySeparatorChar,
                [StringComparison]::OrdinalIgnoreCase)) {
              $manifestErrors.Add("Manifest path escapes package root: $relativePath")
              continue
            }
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              $manifestErrors.Add("Manifest file is missing: $relativePath")
              continue
            }
            $file = Get-Item -LiteralPath $fullPath
            $hash = (Get-FileHash -LiteralPath $fullPath -Algorithm SHA256).Hash
            if ($file.Length -ne [int64]$Matches[2] -or $hash -ne $Matches[1]) {
              $manifestErrors.Add("Manifest mismatch: $relativePath")
            }
          }
          if ($manifestEntries -eq 0 -or $manifestErrors.Count -ne 0) {
            throw "Package manifest verification failed: $($manifestErrors -join '; ')"
          }
          $packagedContentFiles = @(Get-ChildItem -LiteralPath $packageRoot `
            -File -Recurse | Where-Object Name -ne "SHA256SUMS.txt")
          if ($manifestEntries -ne $packagedContentFiles.Count) {
            throw "Package manifest does not cover every content file."
          }
          $metadataPath = Join-Path $packageRoot "licenses\msys2\PACKAGE_METADATA.txt"
          $runtimeOwners = @(Select-String -Path $metadataPath -Pattern '^Name\s*:\s*(.+)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() } |
            Sort-Object -Unique)
          if ($runtimeOwners.Count -eq 0) {
            throw "No MSYS2 runtime owners were recorded."
          }
          if ("mingw-w64-ucrt-x86_64-vulkan-loader" -notin $runtimeOwners) {
            throw "The bundled Vulkan loader owner was not recorded."
          }
          if ("mingw-w64-ucrt-x86_64-sdl3" -notin $runtimeOwners) {
            throw "The bundled SDL3 owner was not recorded."
          }
          $projectLicenseOwners = @(
            "mingw-w64-ucrt-x86_64-ffmpeg",
            "mingw-w64-ucrt-x86_64-libass",
            "mingw-w64-ucrt-x86_64-mpv")
          foreach ($owner in $runtimeOwners) {
            if ($owner -in $projectLicenseOwners) { continue }
            $ownerRoot = Join-Path $packageRoot "licenses\msys2\$owner"
            $texts = @(Get-ChildItem -LiteralPath $ownerRoot -File -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object Name -ne "SOURCE.toml")
            if ($texts.Count -eq 0) {
              throw "Runtime owner has no packaged license or notice text: $owner"
            }
          }
          foreach ($binary in @($executable.FullName, $bridge.FullName)) {
            $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($binary))
            if ($binaryText -match 'YANAMI_DEV_') {
              throw "A production binary contains a development hook: $binary"
            }
          }
          $bridgeText = [Text.Encoding]::ASCII.GetString(
            [IO.File]::ReadAllBytes($bridge.FullName))
          if (-not $bridgeText.Contains($env:YANAMI_RELEASE_VERSION)) {
            throw "The Rust bridge does not contain the candidate version."
          }
          foreach ($binary in @($executable.FullName, $bridge.FullName)) {
            if ((Get-AuthenticodeSignature -LiteralPath $binary).Status -ne "NotSigned") {
              throw "The unsigned release unexpectedly contains an Authenticode signature: $binary"
            }
          }
          $originalPath = $env:PATH
          $originalAppData = $env:APPDATA
          $originalLocalAppData = $env:LOCALAPPDATA
          $originalQpaPlatform = $env:QT_QPA_PLATFORM
          $originalQuickBackend = $env:QT_QUICK_BACKEND
          $isolatedData = Join-Path $extractRoot "isolated-data"
          New-Item -ItemType Directory -Path $isolatedData | Out-Null
          $screenshot = Join-Path $extractRoot "forbidden-dev-hook.png"
          $devLog = Join-Path $extractRoot "forbidden-dev-hook.log"
          $smokeStdout = Join-Path $extractRoot "runtime-smoke.stdout.log"
          $smokeStderr = Join-Path $extractRoot "runtime-smoke.stderr.log"
          $process = $null
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:APPDATA = Join-Path $isolatedData "Roaming"
            $env:LOCALAPPDATA = Join-Path $isolatedData "Local"
            # Hosted runners do not provide an interactive desktop. The
            # offscreen path is already exercised by this project's Qt tests;
            # CI also verifies that qwindows remains in the end-user package.
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:QT_QUICK_BACKEND = "software"
            $env:YANAMI_DEV_AUTOPLAY_FIRST = "1"
            $env:YANAMI_DEV_SCREENSHOT_PATH = $screenshot
            $env:YANAMI_DEV_LOG_PATH = $devLog
            $process = Start-Process -FilePath $executable.FullName `
              -ArgumentList "--runtime-smoke-test" `
              -WorkingDirectory $executable.DirectoryName -WindowStyle Hidden `
              -RedirectStandardOutput $smokeStdout `
              -RedirectStandardError $smokeStderr -PassThru
            if (-not $process.WaitForExit(60000)) {
              throw "The packaged runtime smoke test did not finish within 60 seconds."
            }
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $smokeStdout -ErrorAction SilentlyContinue |
                Write-Host
              Get-Content -LiteralPath $smokeStderr -ErrorAction SilentlyContinue |
                Write-Host
              throw "The packaged runtime smoke test failed with exit code $($process.ExitCode)."
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            $env:PATH = $originalPath
            $env:APPDATA = $originalAppData
            $env:LOCALAPPDATA = $originalLocalAppData
            if ($null -eq $originalQpaPlatform) {
              Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
            } else {
              $env:QT_QPA_PLATFORM = $originalQpaPlatform
            }
            if ($null -eq $originalQuickBackend) {
              Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue
            } else {
              $env:QT_QUICK_BACKEND = $originalQuickBackend
            }
            Remove-Item Env:YANAMI_DEV_AUTOPLAY_FIRST -ErrorAction SilentlyContinue
            Remove-Item Env:YANAMI_DEV_SCREENSHOT_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:YANAMI_DEV_LOG_PATH -ErrorAction SilentlyContinue
          }
          if (Test-Path $screenshot) { throw "A production development hook created a screenshot." }
          if (Test-Path $devLog) { throw "A production development hook created a log." }

      - name: Upload the complete desktop candidate
        id: upload-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Yanami-${{ needs.metadata.outputs.version }}-Windows-x86_64
          path: |
            build/release-windows/Yanami-${{ needs.metadata.outputs.version }}-Windows-x86_64.zip
            build/release-windows/Yanami-${{ needs.metadata.outputs.version }}-Windows-x86_64.zip.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  linux-package:
    name: Build, audit, and verify the Linux AppImage
    needs: metadata
    if: >-
      needs.metadata.outputs.package-relevant == 'true' &&
      (needs.metadata.outputs.scope == 'all' ||
       needs.metadata.outputs.scope == 'linux-only')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: Release
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      YANAMI_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      YANAMI_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
      YANAMI_SOURCE_VERSION: ${{ needs.metadata.outputs.source-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake file jq ninja-build pkg-config \
            libdbus-1-dev libgl1-mesa-dev libice6 libmpv-dev libsm6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-sync1 libxcb-xinput0 libxkbcommon-x11-0
      - name: Install Qt 6.8.3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install \
            --disable-pip-version-check aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/python" -m aqt install-qt \
            linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          qt_root="$RUNNER_TEMP/Qt/6.8.3/gcc_64"
          test -x "$qt_root/bin/qtpaths"
          echo "QT_ROOT_DIR=$qt_root" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-16
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-
      - name: Build, test, and package the AppImage
        shell: bash
        env:
          YANAMI_DANDANPLAY_APP_ID: ${{ secrets.YANAMI_DANDANPLAY_APP_ID }}
          YANAMI_DANDANPLAY_APP_SECRET: ${{ secrets.YANAMI_DANDANPLAY_APP_SECRET }}
          YANAMI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          YANAMI_BUILD_COMMIT: ${{ needs.metadata.outputs.sha }}
          YANAMI_BUILD_RUN_ID: ${{ github.run_id }}
          YANAMI_BUILD_DIR: ${{ github.workspace }}/build/release-linux
          YANAMI_OUTPUT_DIR: ${{ github.workspace }}/build/release-assets
        run: |
          set -euo pipefail
          test -n "$YANAMI_DANDANPLAY_APP_ID"
          test -n "$YANAMI_DANDANPLAY_APP_SECRET"
          bash scripts/package-linux.sh
      - name: Verify the AppImage in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          asset="$GITHUB_WORKSPACE/build/release-assets/Yanami-${YANAMI_RELEASE_VERSION}-Linux-x86_64.AppImage"
          checksum="$asset.sha256"
          test -f "$asset"
          test -f "$checksum"
          (
            cd "$(dirname "$asset")"
            sha256sum -c "$(basename "$checksum")"
          )

          chmod +x "$asset"
          extract_dir="$(mktemp -d "$RUNNER_TEMP/yanami-appimage.XXXXXX")"
          (
            cd "$extract_dir"
            "$asset" --appimage-extract >/dev/null
          )
          package_root="$extract_dir/squashfs-root/usr"
          executable="$package_root/bin/yanami-desktop"
          bridge="$package_root/bin/libyanami_desktop_bridge.so"
          for required in \
              LICENSE README.md README.zh-CN.md THIRD_PARTY_NOTICES.md \
              BUILD_INFO.json SHA256SUMS.txt \
              licenses/RUST_DEPENDENCIES.md \
              licenses/rust/THIRD_PARTY_LICENSES.html \
              licenses/linux/PACKAGE_METADATA.txt; do
            test -f "$package_root/$required"
          done
          test -n "$(find "$package_root/licenses/qt" -type f -print -quit)"
          test -x "$executable"
          test -f "$bridge"
          test -n "$(find "$package_root/lib" -name 'libmpv.so*' -print -quit)"
          file "$executable" | grep -q 'x86-64'
          file "$bridge" | grep -q 'x86-64'

          jq -e \
            --arg version "$YANAMI_RELEASE_VERSION" \
            --arg sourceVersion "$YANAMI_SOURCE_VERSION" \
            --arg commit "$YANAMI_RELEASE_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '.version == $version and .sourceVersion == $sourceVersion and
             .commit == $commit and .workflowRunId == $runId and
             .platform == "Linux" and .architecture == "x86_64"' \
            "$package_root/BUILD_INFO.json" >/dev/null

          while IFS= read -r manifest_line; do
            [[ -z "$manifest_line" || "$manifest_line" == \#* ]] && continue
            if [[ ! "$manifest_line" =~ ^([0-9a-f]{64})\ \ ([0-9]+)\ \ (.+)$ ]]; then
              echo "Malformed package manifest entry: $manifest_line" >&2
              exit 1
            fi
            expected_hash="${BASH_REMATCH[1]}"
            expected_size="${BASH_REMATCH[2]}"
            relative_path="${BASH_REMATCH[3]}"
            full_path="$(realpath "$package_root/$relative_path")"
            [[ "$full_path" == "$package_root/"* ]]
            test "$(stat -c %s "$full_path")" = "$expected_size"
            test "$(sha256sum "$full_path" | cut -d' ' -f1)" = "$expected_hash"
          done < "$package_root/SHA256SUMS.txt"

          for binary in "$executable" "$bridge"; do
            if strings "$binary" | grep 'YANAMI_DEV_' >/dev/null; then
              echo "Production binary contains a development hook: $binary" >&2
              exit 1
            fi
          done
          strings "$bridge" | grep -F "$YANAMI_RELEASE_VERSION" >/dev/null
          ldd_output="$(LD_LIBRARY_PATH="$package_root/lib" ldd "$executable")"
          ! grep -q 'not found' <<<"$ldd_output"
          grep -q 'libmpv' <<<"$ldd_output"

          export XDG_DATA_HOME="$extract_dir/data"
          export XDG_CACHE_HOME="$extract_dir/cache"
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software
          export LD_DEBUG=libs
          export YANAMI_DEV_AUTOPLAY_FIRST=1
          export YANAMI_DEV_SCREENSHOT_PATH="$extract_dir/forbidden.png"
          export YANAMI_DEV_LOG_PATH="$extract_dir/forbidden.log"
          set +e
          timeout 12s "$extract_dir/squashfs-root/AppRun" \
            >"$extract_dir/smoke.stdout" 2>"$extract_dir/loader.log"
          smoke_status=$?
          set -e
          test "$smoke_status" -eq 124
          grep -q 'libyanami_desktop_bridge.so' "$extract_dir/loader.log"
          grep -q 'libmpv' "$extract_dir/loader.log"
          grep -R -q 'application_start' "$XDG_DATA_HOME"
          test ! -e "$extract_dir/forbidden.png"
          test ! -e "$extract_dir/forbidden.log"
      - name: Upload the Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Yanami-${{ needs.metadata.outputs.version }}-Linux-x86_64
          path: |
            build/release-assets/Yanami-${{ needs.metadata.outputs.version }}-Linux-x86_64.AppImage
            build/release-assets/Yanami-${{ needs.metadata.outputs.version }}-Linux-x86_64.AppImage.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  macos-package:
    name: Build, audit, and verify macOS (${{ matrix.architecture }})
    needs: [metadata, linux-package]
    if: >-
      needs.metadata.outputs.scope == 'all' &&
      needs.metadata.outputs.package-relevant == 'true' &&
      needs.linux-package.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    environment: Release
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      YANAMI_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      YANAMI_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
      YANAMI_SOURCE_VERSION: ${{ needs.metadata.outputs.source-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native dependencies
        run: brew install jq mpv pkg-config
      - name: Install Qt 6.8.3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/python" -m pip install \
            --disable-pip-version-check aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/python" -m aqt install-qt \
            mac desktop 6.8.3 clang_64 -O "$RUNNER_TEMP/Qt"
          qt_root="$RUNNER_TEMP/Qt/6.8.3/macos"
          test -x "$qt_root/bin/qtpaths"
          echo "QT_ROOT_DIR=$qt_root" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-16
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-
      - name: Build, test, and package the DMG
        shell: bash
        env:
          YANAMI_DANDANPLAY_APP_ID: ${{ secrets.YANAMI_DANDANPLAY_APP_ID }}
          YANAMI_DANDANPLAY_APP_SECRET: ${{ secrets.YANAMI_DANDANPLAY_APP_SECRET }}
          YANAMI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          YANAMI_BUILD_COMMIT: ${{ needs.metadata.outputs.sha }}
          YANAMI_BUILD_RUN_ID: ${{ github.run_id }}
          YANAMI_BUILD_DIR: ${{ github.workspace }}/build/release-macos-${{ matrix.architecture }}
          YANAMI_OUTPUT_DIR: ${{ github.workspace }}/build/release-assets
        run: |
          set -euo pipefail
          test -n "$YANAMI_DANDANPLAY_APP_ID"
          test -n "$YANAMI_DANDANPLAY_APP_SECRET"
          bash scripts/package-macos.sh
      - name: Verify the DMG and bundled dependency paths
        shell: bash
        run: |
          set -euo pipefail
          asset="$GITHUB_WORKSPACE/build/release-assets/Yanami-${YANAMI_RELEASE_VERSION}-macOS-${{ matrix.architecture }}.dmg"
          checksum="$asset.sha256"
          test -f "$asset"
          test -f "$checksum"
          expected_hash="$(awk 'NR == 1 { print $1 }' "$checksum")"
          actual_hash="$(shasum -a 256 "$asset" | awk '{ print $1 }')"
          test "$actual_hash" = "$expected_hash"

          mount_dir="$(mktemp -d "$RUNNER_TEMP/yanami-dmg.XXXXXX")"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$asset" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT
          app="$mount_dir/Yanami.app"
          executable="$app/Contents/MacOS/Yanami"
          bridge="$app/Contents/MacOS/libyanami_desktop_bridge.dylib"
          test -d "$app"
          test -x "$executable"
          test -f "$bridge"
          test -n "$(find "$app/Contents" -name 'libmpv*.dylib' -print -quit)"
          for required in \
              LICENSE README.md README.zh-CN.md THIRD_PARTY_NOTICES.md \
              BUILD_INFO.json SHA256SUMS.txt \
              licenses/RUST_DEPENDENCIES.md \
              licenses/rust/THIRD_PARTY_LICENSES.html \
              licenses/runtime/HOMEBREW_PACKAGE_METADATA.json; do
            test -f "$mount_dir/$required"
          done
          test -n "$(find "$mount_dir/licenses/runtime/qt" -type f -print -quit)"

          jq -e \
            --arg version "$YANAMI_RELEASE_VERSION" \
            --arg sourceVersion "$YANAMI_SOURCE_VERSION" \
            --arg commit "$YANAMI_RELEASE_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg architecture "${{ matrix.architecture }}" \
            '.version == $version and .sourceVersion == $sourceVersion and
             .commit == $commit and .workflowRunId == $runId and
             .platform == "macOS" and .architecture == $architecture' \
            "$mount_dir/BUILD_INFO.json" >/dev/null

          test "$(lipo -archs "$executable")" = "${{ matrix.architecture }}"
          test "$(lipo -archs "$bridge")" = "${{ matrix.architecture }}"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>"$RUNNER_TEMP/codesign.txt"
          grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"
          bash scripts/verify-macos-bundle.sh "$app"

          for binary in "$executable" "$bridge"; do
            if strings "$binary" | grep 'YANAMI_DEV_' >/dev/null; then
              echo "Production binary contains a development hook: $binary" >&2
              exit 1
            fi
          done
          strings "$bridge" | grep -F "$YANAMI_RELEASE_VERSION" >/dev/null

          smoke_stdout="$RUNNER_TEMP/yanami-smoke-${{ matrix.architecture }}.stdout"
          smoke_stderr="$RUNNER_TEMP/yanami-smoke-${{ matrix.architecture }}.stderr"
          smoke_home="$(mktemp -d "$RUNNER_TEMP/yanami-smoke-home.XXXXXX")"
          forbidden_screenshot="$RUNNER_TEMP/yanami-forbidden-${{ matrix.architecture }}.png"
          forbidden_log="$RUNNER_TEMP/yanami-forbidden-${{ matrix.architecture }}.log"
          env \
            HOME="$smoke_home" \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            QT_QUICK_BACKEND=software \
            YANAMI_DEV_AUTOPLAY_FIRST=1 \
            YANAMI_DEV_SCREENSHOT_PATH="$forbidden_screenshot" \
            YANAMI_DEV_LOG_PATH="$forbidden_log" \
            "$executable" --runtime-smoke-test \
              >"$smoke_stdout" 2>"$smoke_stderr" &
          smoke_pid=$!
          smoke_status=""
          for _ in {1..60}; do
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              if wait "$smoke_pid"; then
                smoke_status=0
              else
                smoke_status=$?
              fi
              break
            fi
            sleep 1
          done
          if [[ -z "$smoke_status" ]]; then
            kill "$smoke_pid" 2>/dev/null || true
            wait "$smoke_pid" 2>/dev/null || true
            cat "$smoke_stdout" >&2
            cat "$smoke_stderr" >&2
            echo "Packaged macOS runtime smoke test timed out." >&2
            exit 1
          fi
          if (( smoke_status != 0 )); then
            cat "$smoke_stdout" >&2
            cat "$smoke_stderr" >&2
            echo "Packaged macOS runtime smoke test failed with exit code $smoke_status." >&2
            exit 1
          fi
          test ! -e "$forbidden_screenshot"
          test ! -e "$forbidden_log"

          while IFS= read -r manifest_line; do
            [[ -z "$manifest_line" || "$manifest_line" == \#* ]] && continue
            if [[ ! "$manifest_line" =~ ^([0-9a-f]{64})\ \ ([0-9]+)\ \ (.+)$ ]]; then
              echo "Malformed package manifest entry: $manifest_line" >&2
              exit 1
            fi
            expected_file_hash="${BASH_REMATCH[1]}"
            expected_size="${BASH_REMATCH[2]}"
            relative_path="${BASH_REMATCH[3]}"
            [[ "$relative_path" != /* && "$relative_path" != *../* ]]
            full_path="$mount_dir/$relative_path"
            test -e "$full_path"
            test "$(stat -f %z "$full_path")" = "$expected_size"
            test "$(shasum -a 256 "$full_path" | awk '{ print $1 }')" = "$expected_file_hash"
          done < "$mount_dir/SHA256SUMS.txt"
      - name: Upload the macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Yanami-${{ needs.metadata.outputs.version }}-macOS-${{ matrix.architecture }}
          path: |
            build/release-assets/Yanami-${{ needs.metadata.outputs.version }}-macOS-${{ matrix.architecture }}.dmg
            build/release-assets/Yanami-${{ needs.metadata.outputs.version }}-macOS-${{ matrix.architecture }}.dmg.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  candidate:
    name: Assemble the manually publishable candidate
    needs: [metadata, windows-package, linux-package, macos-package]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.metadata.outputs.scope == 'all' &&
      needs.metadata.outputs.package-relevant == 'true' &&
      needs.windows-package.result == 'success' &&
      needs.linux-package.result == 'success' &&
      needs.macos-package.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      YANAMI_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      YANAMI_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
      YANAMI_SOURCE_VERSION: ${{ needs.metadata.outputs.source-version }}
    steps:
      - name: Download the verified Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Yanami-${{ needs.metadata.outputs.version }}-Windows-x86_64
          path: release-assets
      - name: Download the verified Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Yanami-${{ needs.metadata.outputs.version }}-Linux-x86_64
          path: release-assets
      - name: Download both verified macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Yanami-${{ needs.metadata.outputs.version }}-macOS-*
          path: release-assets
          merge-multiple: true
      - name: Reverify and index the release boundary
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t candidates < <(find . -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -printf '%f\n' | sort)
          test "${#candidates[@]}" -eq 4
          test "$(printf '%s\n' "${candidates[@]}" | grep -c -- '-Windows-x86_64.zip$')" -eq 1
          test "$(printf '%s\n' "${candidates[@]}" | grep -c -- '-Linux-x86_64.AppImage$')" -eq 1
          test "$(printf '%s\n' "${candidates[@]}" | grep -c -- '-macOS-arm64.dmg$')" -eq 1
          test "$(printf '%s\n' "${candidates[@]}" | grep -c -- '-macOS-x86_64.dmg$')" -eq 1

          : > files.jsonl
          : > SHA256SUMS.txt
          for candidate_file in "${candidates[@]}"; do
            checksum_file="$candidate_file.sha256"
            test -f "$checksum_file"
            expected_hash="$(awk 'NR == 1 { print tolower($1) }' "$checksum_file")"
            actual_hash="$(sha256sum "$candidate_file" | cut -d' ' -f1)"
            test "$actual_hash" = "$expected_hash"
            file_size="$(stat -c %s "$candidate_file")"
            printf '%s  %s\n' "$actual_hash" "$candidate_file" >> SHA256SUMS.txt
            jq -nc \
              --arg name "$candidate_file" \
              --arg sha256 "$actual_hash" \
              --argjson size "$file_size" \
              '{name: $name, sha256: $sha256, size: $size}' >> files.jsonl
          done
          jq -s . files.jsonl > files.json
          jq -n \
            --arg version "$YANAMI_RELEASE_VERSION" \
            --arg sourceVersion "$YANAMI_SOURCE_VERSION" \
            --arg tag "v$YANAMI_RELEASE_VERSION" \
            --arg commit "$YANAMI_RELEASE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile files files.json \
            '{schemaVersion: 1, version: $version, sourceVersion: $sourceVersion,
              intendedTag: $tag, commit: $commit, repository: $repository,
              packageWorkflowRunId: $runId, packageWorkflowUrl: $runUrl,
              releasePolicy: "manual-prerelease-only",
              signing: {windows: "unsigned", linux: "unsigned",
                        macOS: "ad-hoc; not notarized"}, files: $files[0]}' \
            > release-manifest.json
          rm files.json files.jsonl
      - name: Upload the complete manual release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Yanami-${{ needs.metadata.outputs.version }}-all-platforms
          path: release-assets
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Record the manual handoff
        shell: bash
        run: |
          {
            echo "## Candidate ready for manual release"
            echo
            echo "Download artifact \`Yanami-$YANAMI_RELEASE_VERSION-all-platforms\`."
            echo "It targets tag \`v$YANAMI_RELEASE_VERSION\` at commit \`$YANAMI_RELEASE_SHA\`."
            echo "No tag or GitHub Release was created by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
