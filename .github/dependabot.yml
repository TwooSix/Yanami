version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    # Dependabot's Cargo classifier treats changes to the leftmost non-zero
    # component as major, so minor/patch here stays within Cargo-compatible
    # ranges. Security updates ignore allow.update-types and may still widen
    # Cargo.toml when a fix requires it.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 1
    groups:
      rust-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
    allow:
      - dependency-type: all
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore(deps)"
